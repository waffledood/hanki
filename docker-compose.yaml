version: "3.8"
services:
  # DB
  db:
    image: postgres:latest
    restart: always
    ports:
      - 5432:5432
    environment:
      POSTGRESQL_USER: hanki_app
      POSTGRES_PASSWORD: supersecurepassword
      POSTGRESQL_DATABASE: hanki
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Spring Boot Backend Service
  backend:
    build:
      context: ./hanki-backend # Path to the directory containing your Spring Boot project and Dockerfile
      dockerfile: Dockerfile # Name of the Dockerfile (optional, defaults to Dockerfile)
    ports:
      - 8080:8080 # Map host port 8080 to container port 8080
    environment:
      # Spring Boot application properties for connecting to the database
      # Make sure these match your application's configuration expectations
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/hanki # 'db' is the service name in Docker Compose
      SPRING_DATASOURCE_USERNAME: hanki_app
      SPRING_DATASOURCE_PASSWORD: supersecurepassword
      # Add any other Spring Boot environment variables your app needs (e.g., logging level, other API keys)
      # SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - db # Ensures the 'db' service starts before 'backend'
    # Optional: healthcheck for more robust startup order (requires Spring Boot Actuator)
    # healthcheck:
    #   test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 5
    restart: on-failure # Or 'always', depending on your preference

  # React Frontend
  frontend:
    build:
      context: ./hanki-frontend
      dockerfile: Dockerfile
    ports:
      - 3000:3000
    depends_on:
      - backend
    environment:
      REACT_APP_BACKEND_URL: http://backend:8080
    volumes:
      - ./hanki-frontend:/app
      - /app/node_modules
    restart: on-failure

volumes:
  pgdata:
